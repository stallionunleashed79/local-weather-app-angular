<form>
  <mat-form-field>
    <mat-label>City Name or Postal Code</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      aria-label="City or Zip"
      placeholder="Enter city name"
      [formControl]="search" />
    <mat-hint>Enter city name or postal code</mat-hint>
  </mat-form-field>
</form>
